name: jackettio
services:

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
    networks:
      - jackettio
    restart: unless-stopped

  # jackett:
  #   image: lscr.io/linuxserver/jackett:latest
  #   container_name: jackett
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - TZ=Etc/UTC
  #     - AUTO_UPDATE=true #optional
  #     - RUN_OPTS= #optional
  #   volumes:
  #     - /path/to/jackett/data:/config
  #     - /path/to/blackhole:/downloads
  #   ports:
  #     - 9117:9117
  #   depends_on:
  #     - flaresolverr
  #   networks:
  #     - jackettio
    # restart: unless-stopped

  jackettio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jackettio
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - DATA_FOLDER=/data
    networks:
      jackettio: {}
      coolify:
        aliases:
          - jackettio
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jackettio-data:/data

  mediaflow-proxy:
    image: mhdzumair/mediaflow-proxy:latest
    container_name: mediaflow-proxy
    env_file:
      - .env
    networks:
      jackettio: {}
      coolify:
        aliases:
          - mediaflow-proxy

networks:
  jackettio:
  coolify:
    external: true

volumes:
  jackett-config:
  jackett-downloads:
  jackettio-data:
